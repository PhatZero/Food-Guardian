name: Release Food Guardian on merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.title, 'Release beta:') || startsWith(github.event.pull_request.title, 'Release:'))
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      changelog: ${{ github.event.pull_request.body }}
      curseforge: true
    secrets: inherit
